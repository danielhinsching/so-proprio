-- so-proprio: memória e tempo de boot no fundo da tela (canto superior direito).
-- Pode editar à vontade: o ./add desktop não sobrescreve este arquivo depois de criado.
conky.config = {
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 48,
    update_interval = 10,

    own_window = true,
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    -- Sem compositor (Openbox), transparência vira um quadro preto: fundo sólido de propósito.
    own_window_transparent = false,
    own_window_colour = '1e2430',
    double_buffer = true,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    default_color = 'd8dee9',
    color1 = '88c0d0',
    draw_shades = false,
    draw_borders = false,
    border_inner_margin = 12,
}

conky.text = [[
${color1}$$ free -h${color}
${execi 10 free -h}
${color1}$$ systemd-analyze${color}
${execi 60 systemd-analyze 2>&1 | fold -s -w 72}
]]
